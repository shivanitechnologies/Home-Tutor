<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Sign in to your HomeTutor family account."><title>Log in | HomeTutor</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/site.css"><script defer src="https://unpkg.com/lucide@latest"></script></head>
<body><div class="auth-controls"><button id="theme-toggle" class="btn btn-sm btn-outline" aria-label="Toggle dark mode"><i data-lucide="moon"></i></button><button id="rtl-toggle" class="btn btn-sm btn-outline">RTL</button></div><main class="auth-page"><section class="auth-card"><a href="../index.html" class="logo"><span class="logo-mark"><i data-lucide="book-open-check"></i></span>HomeTutor</a><h1>Welcome back</h1><p class="muted">Sign in to keep your learner’s progress moving.</p><div class="auth-social mt-4"><button class="btn btn-outline" type="button" data-message="Google sign-in will be available when authentication is connected."><i data-lucide="chrome"></i> Google</button><button class="btn btn-outline" type="button" data-message="Apple sign-in will be available when authentication is connected."><i data-lucide="apple"></i> Apple</button></div><div class="auth-divider">or continue with email</div><form class="auth-form"><div class="field"><label for="email">Email address</label><input id="email" name="email" class="form-control" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" class="form-control" type="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" class="password-toggle" data-target="#password" aria-label="Show password"><i data-lucide="eye"></i></button></div></div><div class="auth-inline"><label><input type="checkbox" name="remember"> Remember me</label><a class="text-primary" href="forgot-password.html">Forgot password?</a></div><button class="btn btn-primary w-100 mt-4" type="submit">Log in to HomeTutor</button></form><p class="text-center mt-4">New to HomeTutor? <a class="text-primary" href="register.html">Create an account</a></p><p class="text-center muted" style="font-size:.8rem">By continuing, you agree to our <a href="../content.html?view=terms">Terms</a> and <a href="../content.html?view=privacy">Privacy Policy</a>.</p></section></main><script src="../js/core.js"></script><script src="../js/site.js"></script></body></html>
