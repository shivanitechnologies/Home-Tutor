<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Create a HomeTutor family account and find your learner's next great teacher."><title>Create an account | HomeTutor</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/site.css"><script defer src="https://unpkg.com/lucide@latest"></script></head>
<body><div class="auth-controls"><button id="theme-toggle" class="btn btn-sm btn-outline" aria-label="Toggle dark mode"><i data-lucide="moon"></i></button><button id="rtl-toggle" class="btn btn-sm btn-outline">RTL</button></div><main class="auth-page"><section class="auth-card"><a href="../index.html" class="logo"><span class="logo-mark"><i data-lucide="book-open-check"></i></span>HomeTutor</a><h1>Make learning personal</h1><p class="muted">Create a family account to save tutors and manage lessons.</p><div class="auth-social mt-4"><button class="btn btn-outline" type="button" data-message="Google sign-in will be available when authentication is connected."><i data-lucide="chrome"></i> Google</button><button class="btn btn-outline" type="button" data-message="Apple sign-in will be available when authentication is connected."><i data-lucide="apple"></i> Apple</button></div><div class="auth-divider">or create an account with email</div><form class="auth-form"><div class="field"><label for="name">Your name</label><input id="name" name="name" class="form-control" autocomplete="name" placeholder="Full name" required></div><div class="field"><label for="email">Email address</label><input id="email" name="email" class="form-control" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="password">Create password</label><div class="password-wrap"><input id="password" name="password" class="form-control" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required><button type="button" class="password-toggle" data-target="#password" aria-label="Show password"><i data-lucide="eye"></i></button></div></div><label class="d-flex gap-2"><input type="checkbox" required> I agree to the <a class="text-primary" href="../content.html?view=terms">Terms</a> and <a class="text-primary" href="../content.html?view=privacy">Privacy Policy</a></label><button class="btn btn-primary w-100 mt-4" type="submit">Create family account</button></form><p class="text-center mt-4">Already have an account? <a class="text-primary" href="login.html">Log in</a></p></section></main><script src="../js/core.js"></script><script src="../js/site.js"></script></body></html>
